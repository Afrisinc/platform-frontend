name: Deploy Platform Web - Staging

on:
  push:
    branches:
      - release

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      DEPLOY_GHCR_USERNAME: ${{ secrets.DEPLOY_GHCR_USERNAME }}
      DEPLOY_GHCR_TOKEN: ${{ secrets.DEPLOY_GHCR_TOKEN }}

    steps:
      # Step 1: Checkout code
      - name: Checkout repository
        uses: actions/checkout@v3

      # Step 2: Login to GitHub Container Registry
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_OWNER }}
          password: ${{ secrets.GHCR_TOKEN }}

      # Step 3: Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Step 4: Build and push Docker image
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ secrets.GHCR_OWNER }}/control:sha-${{ github.sha }}
            ghcr.io/${{ secrets.GHCR_OWNER }}/control:staging

      # Step 5: SSH deploy to VPS
      - name: Deploy to VPS
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          timeout: 30s
          command_timeout: 10m

          # 🔐 PASS DEPLOY CREDS TO VPS
          envs: DEPLOY_GHCR_USERNAME,DEPLOY_GHCR_TOKEN
          script: |
            set -e
            APP_PATH="${{ secrets.VPS_APP_PATH }}/control/staging"
            cd $APP_PATH

            echo "$DEPLOY_GHCR_TOKEN" | docker login ghcr.io -u "$DEPLOY_GHCR_USERNAME" --password-stdin

            docker compose pull
            docker compose up -d
            docker image prune -af
